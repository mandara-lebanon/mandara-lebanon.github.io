<style>
/* Layout: one calm column, one question per screen, big tap targets; Mandara cream, ink and bronze. */
:root{
  --paper:#F6F0EB; --card:#FFFDFB; --ink:#211510; --muted:#6B6460; --line:#E3D9CF;
  --bronze:#8A6134; --bronze-2:#B27B53; --bronze-soft:#EFE3D6; --sel:#211510; --sel-ink:#FFFDFB;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;gap:12px}
header.top img{height:30px;width:auto}
.where{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--bronze-2);transition:width .35s ease}
main{flex:1;display:flex;flex-direction:column;padding:22px 0 28px}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);font-weight:600;margin-bottom:10px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,8vw,46px);line-height:1.05;margin:0 0 14px;text-wrap:balance}
h2.q{font-family:var(--display);font-weight:600;font-size:clamp(25px,5.6vw,31px);line-height:1.18;margin:0 0 6px;text-wrap:balance}
.help{color:var(--muted);font-size:14px;margin:0 0 18px}
.lead{font-family:var(--display);font-size:20px;line-height:1.4;color:#3B3330;margin:0 0 18px}
.intro p{margin:0 0 12px;color:#3B3330}
.feat{list-style:none;padding:0;margin:6px 0 20px;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start}
.feat li:before{content:"";flex:0 0 7px;height:7px;margin-top:9px;background:var(--bronze-2);transform:rotate(45deg)}
.banner{width:100%;height:auto;border-radius:10px;display:block;margin:4px 0 22px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:15.5px;color:var(--ink);
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .08s}
.opt:hover{border-color:var(--bronze-2)}
.opt:active{transform:scale(.99)}
.opt .k{flex:0 0 22px;height:22px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px}
.opt.multi .k{border-radius:6px}
.opt[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.opt[aria-pressed="true"] .k{border-color:var(--bronze-2);background:var(--bronze-2)}
.opt[aria-pressed="true"] .k:after{content:"";width:8px;height:8px;border-radius:2px;background:var(--sel-ink)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt:focus-visible,.btn:focus-visible,.link:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--bronze-2);outline-offset:2px}
input.txt,textarea.txt{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px}
textarea.txt{min-height:120px;resize:vertical}
.other{margin-top:9px}
.count{font-size:13px;color:var(--muted);margin-top:10px}
.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
.btn{font:inherit;font-weight:600;font-size:15.5px;border:0;border-radius:999px;padding:14px 26px;background:var(--ink);color:var(--paper);cursor:pointer}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.big{width:100%;padding:17px;font-size:16.5px}
.link{font:inherit;font-size:14.5px;background:none;border:0;color:var(--muted);cursor:pointer;padding:10px 4px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;text-align:center}
.done{text-align:center;padding-top:30px}
.done .mark{width:62px;height:62px;margin:0 auto 18px;border-radius:50%;background:var(--bronze-soft);display:grid;place-items:center}
footer{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 0 22px;letter-spacing:.04em}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
.actions.sticky{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:10px;background:linear-gradient(to top,var(--paper) 70%,rgba(246,240,235,0))}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>

<script>

const DATA = {"intro": "Help shape the future of show jumping and equestrian sport in Lebanon.\n\nMandara Equestrian Club is exploring the development of a premium equestrian centre in the Bekaa Valley, Lebanon.\n\nThe proposed centre is being designed around show jumping, professional training, horse boarding and care, riding lessons, horse leasing, competitions, and British Horse Society (BHS) education and qualifications, subject to the necessary approvals.\n\nThe proposed facilities include professionally designed arenas, a covered arena, premium stables and paddocks, training and horse-care services, onsite student accommodation, and on-site 24/7 security.\n\nWe want to understand the needs, preferences and concerns of Lebanon’s equestrian community before finalising our services and operating model.\n\nThis survey takes approximately 10–15 minutes, depending on your answers. Participation is voluntary. Responses will be analysed collectively; contact details, if provided voluntarily, will be used only for the purpose explained when collected.\n\nThank you for helping us understand the Lebanese equestrian market.", "sections": [{"id": "S0", "title": "Section A — About you", "help": "", "questions": [{"id": "Q1", "label": "1. Which of the following best describes you?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Competitive show-jumping rider", "Amateur show-jumping rider", "Recreational rider", "Beginner or aspiring rider", "Private horse owner", "Parent or guardian of a young rider", "Professional coach or instructor", "Professional rider", "Horse trainer", "Groom or stable manager", "Equine veterinarian or other equine professional", "Equestrian club or yard owner/manager", "Equine business owner", "Student interested in an equestrian career"], "other": true, "max": null}, {"id": "Q2", "label": "2. Where do you currently live or spend most of your time?", "type": "single", "help": "", "required": true, "options": ["Beirut", "Metn", "Keserwan / Jbeil", "Baabda / Aley / Chouf", "North Lebanon", "South Lebanon", "Bekaa Valley", "Other area of Lebanon", "United Arab Emirates", "Saudi Arabia", "Qatar", "Kuwait", "Other Gulf country", "Europe", "Other country"], "other": false, "max": null}, {"id": "Q3", "label": "3. What is your relationship with Lebanon?", "type": "single", "help": "", "required": true, "options": ["I live in Lebanon year-round", "I live abroad but visit Lebanon regularly", "I spend summers in Lebanon", "I am considering returning to Lebanon", "I live abroad and would travel to Lebanon specifically for equestrian activities"], "other": true, "max": null}, {"id": "Q4", "label": "4. Which age group are you in?", "type": "single", "help": "", "required": true, "options": ["Under 18 — survey completed with a parent or guardian", "18–24", "25–34", "35–44", "45–54", "55 or above", "Prefer not to say"], "other": false, "max": null}, {"id": "Q5", "label": "5. What is your primary equestrian interest?", "type": "single", "help": "", "required": true, "options": ["Competitive show jumping", "Developing a young show-jumping horse", "Improving my riding", "Recreational riding", "Owning and caring for horses", "Developing a child’s riding career", "Professional equestrian education", "Working in the equestrian industry"], "other": true, "max": null}, {"id": "G1", "label": "Do you currently ride, or are you learning to ride?", "type": "single", "help": "", "required": true, "options": ["Yes", "No"], "other": false, "max": null, "route": {"Yes": "S1", "No": "S2"}}]}, {"id": "S1", "title": "Section B — Riding and competition profile", "help": "", "questions": [{"id": "Q6", "label": "6. How many years of riding experience do you have?", "type": "single", "help": "", "required": true, "options": ["Not yet riding", "Less than one year", "1–3 years", "4–7 years", "8–15 years", "More than 15 years"], "other": false, "max": null}, {"id": "Q7", "label": "7. What is your current show-jumping level?", "type": "single", "help": "", "required": true, "options": ["Not jumping yet", "Below 60 cm", "60–80 cm", "90–100 cm", "110–120 cm", "125–135 cm", "140 cm or above", "I do not currently compete or jump"], "other": false, "max": null}, {"id": "Q8", "label": "8. How frequently do you ride?", "type": "single", "help": "", "required": true, "options": ["Five or more times per week", "Three to four times per week", "Once or twice per week", "Two to three times per month", "Once a month or less", "Not currently riding"], "other": false, "max": null}, {"id": "Q9", "label": "9. How frequently do you compete in show jumping?", "type": "single", "help": "", "required": true, "options": ["Weekly or nearly weekly during the season", "Monthly", "Several times per season", "Once or twice per year", "I train but do not compete", "I would like to compete but currently cannot", "Not applicable"], "other": false, "max": null}, {"id": "Q10", "label": "10. What type of competitions do you currently attend?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Club competitions", "National competitions in Lebanon", "FEI-recognised international competitions", "Competitions in the Gulf", "Competitions in Europe", "Other international competitions", "None currently"], "other": false, "max": null}, {"id": "Q11", "label": "11. What are your main goals over the next two years?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Start riding", "Progress to a higher jumping height", "Compete more frequently", "Qualify for national or international competitions", "Buy or lease a competition horse", "Develop a young horse", "Improve my horse’s training", "Obtain professional riding or coaching qualifications", "Pursue an equestrian career abroad", "Ride recreationally", "Help my child progress in the sport"], "other": true, "max": null}, {"id": "Q12", "label": "12. How satisfied are you with your current opportunities for show-jumping training in Lebanon?", "type": "single", "help": "", "required": true, "options": ["Very satisfied", "Satisfied", "Neither satisfied nor dissatisfied", "Dissatisfied", "Very dissatisfied", "Not familiar enough to answer"], "other": false, "max": null}, {"id": "Q13", "label": "13. What are the biggest challenges you currently face as a rider?", "type": "multi", "help": "Select up to three.", "required": true, "options": ["Limited arena availability", "Arena footing or maintenance", "Lack of a covered arena", "Limited access to qualified coaches", "Limited access to suitable school horses", "High cost of lessons or training", "High cost of horse ownership", "Limited access to competitions", "Transport and travel time", "Lack of suitable stabling or turnout", "Limited opportunities for professional development", "Difficulty finding suitable horses to lease"], "other": true, "max": 3}]}, {"id": "S2", "title": "Section C — Your current club or yard", "help": "", "questions": [{"id": "Q14", "label": "14. Where is your current riding club or horse’s yard located?", "type": "single", "help": "", "required": true, "options": ["Beirut", "Metn", "Keserwan / Jbeil", "Baabda / Aley / Chouf", "North Lebanon", "South Lebanon", "Bekaa Valley", "Outside Lebanon", "I do not currently use a club or yard"], "other": false, "max": null, "route": {"Beirut": "S3", "Metn": "S3", "Keserwan / Jbeil": "S3", "Baabda / Aley / Chouf": "S3", "North Lebanon": "S3", "South Lebanon": "S3", "Bekaa Valley": "S3", "Outside Lebanon": "S3", "I do not currently use a club or yard": "S5"}}]}, {"id": "S3", "title": "Section C — Your current club or yard (continued)", "help": "", "questions": [{"id": "Q15", "label": "15. Which club or yard do you currently use?", "type": "short", "help": "Optional.", "required": false, "options": [], "other": false, "max": null}, {"id": "Q16", "label": "16. What services do you currently use at that facility?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Riding lessons", "Show-jumping training", "Private horse livery", "Full training livery", "Horse exercise or schooling", "Horse leasing", "Competition preparation", "Competition hosting", "Clinics with visiting coaches", "Stable management or professional training"], "other": true, "max": null}, {"id": "Q17", "label": "17. What do you value most about your current club or yard?", "type": "multi", "help": "Select up to three.", "required": true, "options": ["Location and accessibility", "Quality of arenas and footing", "Quality of stables", "Turnout and paddocks", "Coaching quality", "Quality of school or training horses", "Competition opportunities", "Veterinary and farrier coordination", "Social environment and riding community", "Price and value for money", "Security"], "other": true, "max": 3}, {"id": "Q18", "label": "18. What would you most like your current club or yard to improve?", "type": "long", "help": "Optional.", "required": false, "options": [], "other": false, "max": null}, {"id": "Q19", "label": "19. Have you considered changing your current club, trainer or livery yard in the past two years?", "type": "single", "help": "", "required": true, "options": ["Yes, and I changed", "Yes, but I did not change", "No", "Not applicable"], "other": false, "max": null, "route": {"Yes, and I changed": "S4", "Yes, but I did not change": "S4", "No": "S5", "Not applicable": "S5"}}]}, {"id": "S4", "title": "Section C — Changing clubs", "help": "", "questions": [{"id": "Q20", "label": "20. What were the main reasons you considered changing?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Better facilities", "Better coach or training programme", "Better horse care", "More competitive opportunities", "Better value for money", "Location", "Security", "Personal or community reasons"], "other": true, "max": null}]}, {"id": "S5", "title": "Section D — The Bekaa as an equestrian destination", "help": "The proposed Mandara centre is in the Bekaa Valley, Lebanon. These questions matter most to us.", "questions": [{"id": "Q21", "label": "21. How familiar are you with the Bekaa Valley?", "type": "single", "help": "", "required": true, "options": ["I live there", "I visit frequently", "I visit occasionally", "I have visited but rarely go", "I have never visited"], "other": false, "max": null}, {"id": "Q22", "label": "22. How long would it normally take you to reach the proposed Mandara location in the Bekaa?", "type": "single", "help": "", "required": true, "options": ["Less than 30 minutes", "30–60 minutes", "1–1.5 hours", "1.5–2 hours", "More than two hours", "I cannot estimate"], "other": false, "max": null}, {"id": "Q23", "label": "23. How would you describe your willingness to travel to the Bekaa for equestrian activities?", "type": "single", "help": "", "required": true, "options": ["Very willing", "Somewhat willing", "Neither willing nor unwilling", "Somewhat unwilling", "Very unwilling"], "other": false, "max": null}, {"id": "Q24", "label": "24. Which factors influence your decision to travel to an equestrian centre in the Bekaa?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Actual door-to-door journey time", "Road conditions and accessibility", "Personal safety and security", "Reliability of travel throughout the year", "Winter weather", "Availability of parking", "Availability of suitable transport", "Quality of facilities", "Quality of coaching", "Presence of friends or an established riding community", "Accommodation and hospitality", "Family-friendly facilities", "Cost of travel"], "other": true, "max": null}, {"id": "Q25", "label": "25. What would be your biggest concern about using a premium equestrian centre in the Bekaa?", "type": "multi", "help": "Select up to three.", "required": true, "options": ["Distance from home", "Traffic or road conditions", "Personal security", "Security of horses and property", "Winter weather or road access", "Access to emergency veterinary care", "Access to farriers and specialist equine services", "Limited opportunities to meet other riders", "Separation from my current coach", "Separation from my current club", "Cost of travel", "No significant concerns"], "other": true, "max": 3}, {"id": "Q26", "label": "26. What would make you more comfortable travelling to the Bekaa?", "type": "multi", "help": "Select up to three.", "required": true, "options": ["A verified security and emergency-response plan", "Demonstrated year-round road accessibility", "A shuttle or organised transport service", "A well-established competition calendar", "Recognised coaches and professional staff", "Recommendations from trusted riders", "Opportunities to meet and train with other riders", "A restaurant, café or clubhouse", "On-site accommodation", "Family facilities", "Trial visits before committing"], "other": true, "max": 3}, {"id": "Q27", "label": "27. How often would you realistically travel to the Bekaa for riding or training?", "type": "single", "help": "", "required": true, "options": ["Several times per week", "Once per week", "Two to three times per month", "Once per month", "A few times per year", "Only for competitions, clinics or courses", "I would not travel there"], "other": false, "max": null}, {"id": "Q28", "label": "28. Would you consider spending a full day at an equestrian centre in the Bekaa?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Yes, for regular training", "Yes, for occasional intensive training", "Yes, for competitions or clinics", "Yes, for family or recreational activities", "Maybe", "No"], "other": false, "max": null}, {"id": "Q29", "label": "29. Would you consider staying overnight in the Bekaa for equestrian activities?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Yes, for a weekend", "Yes, for a multi-day training camp", "Yes, for a professional course", "Yes, for a competition", "Possibly, depending on facilities and price", "No"], "other": false, "max": null}, {"id": "Q30", "label": "30. Would a shuttle service between Beirut (or another major city) and Mandara influence your decision?", "type": "single", "help": "", "required": true, "options": ["It would make me much more likely to attend", "It would make me somewhat more likely to attend", "It would make no difference", "I would prefer to drive myself", "I would not attend regardless"], "other": false, "max": null}, {"id": "Q31", "label": "31. Would you consider using the Bekaa for seasonal training because of its climate and available space?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Yes, during summer", "Yes, during winter", "Yes, throughout the year", "Possibly, depending on conditions", "No"], "other": false, "max": null}, {"id": "G2", "label": "Do you currently own, lease or manage horses?", "type": "single", "help": "", "required": true, "options": ["Yes", "No"], "other": false, "max": null, "route": {"Yes": "S6", "No": "S8"}}]}, {"id": "S6", "title": "Section E — Private horse owners and livery", "help": "", "questions": [{"id": "Q32", "label": "32. How many horses do you currently own or have responsibility for?", "type": "single", "help": "", "required": true, "options": ["One", "Two", "Three to four", "Five to eight", "More than eight"], "other": false, "max": null}, {"id": "Q33", "label": "33. Where are your horses currently stabled?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Beirut", "Metn", "Keserwan / Jbeil", "Baabda / Aley / Chouf", "North Lebanon", "South Lebanon", "Bekaa Valley", "UAE", "Saudi Arabia", "Other Gulf country", "Europe"], "other": true, "max": null}, {"id": "Q34", "label": "34. What is the primary purpose of the horses you own or manage?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Competitive show jumping", "Young horse develo ed": true, "options": ["Very likely", "Somewhat likely", "Unsure", "Somewhat unlikely", "Very unlikely"], "other": false, "max": null}, {"id": "Q106", "label": "106. What is the single most important factor that would determine whether you choose Mandara?", "type": "long", "help": "Optional.", "required": false, "options": [], "other": false, "max": null}, {"id": "Q107", "label": "107. What would be your main reason for not choosing Mandara?", "type": "long", "help": "Optional.", "required": false, "options": [], "other": false, "max": null}, {"id": "Q108", "label": "108. What services, facilities or partnerships would you most like Mandara to offer?", "type": "long", "help": "Optional.", "required": false, "options": [], "other": false, "max": null}, {"id": "Q109", "label": "109. Would you be willing to take part in a follow-up interview or visit the proposed facility?", "type": "multi", "help": "Select all that apply.", "required": true, "options": ["Yes, for a short interview", "Yes, for a site visit", "Yes, for a follow-up discussion about services and pricing", "No"], "other": false, "max": null}, {"id": "Q110", "label": "110. Any other comments or suggestions?", "type": "long", "help": "Optional.", "required": false, "options": [], "other": false, "max": null}, {"id": "Q111", "label": "111. Would you like to receive updates about Mandara’s development?", "type": "single", "help": "", "required": true, "options": ["Yes", "No"], "other": false, "max": null, "route": {"Yes": "S22", "No": "END"}}]}, {"id": "S22", "title": "Your contact details (optional)", "help": "Used only to send you updates about Mandara Lebanon and, if you agreed above, to arrange a follow-up. Leave blank if you prefer.", "questions": [{"id": "C_name", "label": "Name", "type": "short", "help": "", "required": false, "options": [], "other": false, "max": null}, {"id": "C_whatsapp", "label": "WhatsApp number (with country code)", "type": "short", "help": "", "required": false, "options": [], "other": false, "max": null}, {"id": "C_email", "label": "Email", "type": "short", "help": "", "required": false, "options": [], "other": false, "max": null}]}]};
const S = DATA.sections;
const app = document.getElementById('app'), bar = document.getElementById('bar');
const KEY = 'mandara-lb-survey-v1';
let st = load() || { id: rid(), started: Date.now(), answers: {}, hist: [], pos: null };

function rid(){ return 'R' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase(); }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
function clean(t){ return t.replace(/^\d+\.\s*/, ''); }
function sectionName(s){ return s.title.replace(/^Section [A-Z]\s*—\s*/, '').replace(/\s*\(continued\)$/,''); }
function el(tag, attrs, ...kids){ const e=document.createElement(tag); for(const k in (attrs||{})){ if(k==='class') e.className=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),attrs[k]); else if(attrs[k]!==false && attrs[k]!=null) e.setAttribute(k,attrs[k]); } kids.flat().forEach(c=>{ if(c==null) return; e.append(c.nodeType?c:document.createTextNode(c)); }); return e; }
function progress(){ const p = st.pos ? (st.pos.s + st.pos.q / Math.max(1,S[st.pos.s].questions.length)) / S.length : 0; bar.style.width = Math.round(p*100) + '%'; }

// ---------- intro ----------
function intro(){
  bar.style.width='0%';
  app.replaceChildren(el('section',{class:'intro fade'},
    el('img',{class:'banner',src:'banner.png',alt:'Mandara Equestrian Club, Lebanon'}),
    el('div',{class:'eyebrow'},'Show-jumping & equestrian market research'),
    el('h1',{},'Help shape show jumping in Lebanon'),
    el('p',{class:'lead'},'Mandara Equestrian Club is exploring a premium equestrian centre in the Bekaa Valley.'),
    el('ul',{class:'feat'},
      el('li',{},'Professionally designed arenas, including a covered arena'),
      el('li',{},'Premium stables, paddocks, training and horse-care services'),
      el('li',{},'British Horse Society (BHS) courses and qualifications, subject to approval'),
      el('li',{},'On-site student accommodation and 24/7 security')),
    el('p',{},'We want to understand the needs, preferences and concerns of Lebanon\u2019s equestrian community before finalising our services.'),
    el('p',{},'About 10–15 minutes, depending on your answers. No sign-in. Participation is voluntary and answers are analysed collectively.'),
    el('div',{class:'actions'}, el('button',{class:'btn big',onclick:start}, st.pos ? 'Continue where you left off' : 'Start the survey')),
    st.pos ? el('button',{class:'link',style:'display:block;margin:8px auto 0',onclick:()=>{ st={id:rid(),started:Date.now(),answers:{},hist:[],pos:null}; save(); start(); }},'Start again') : null
  ));
}
function start(){ if(!st.pos){ st.pos={s:0,q:0}; st.hist=[]; } save(); show(); }

// ---------- navigation ----------
function nextPos(){
  const {s,q} = st.pos, sec = S[s];
  if(q < sec.questions.length-1) return {s, q:q+1};
  let target = null;
  sec.questions.forEach(x=>{ if(x.route && st.answers[x.id]!=null){ const a = st.answers[x.id]; const t = x.route[a]; if(t) target=t; } });
  if(target==='END') return 'END';
  if(target){ const i = S.findIndex(z=>z.id===target); return {s:i,q:0}; }
  return s+1 < S.length ? {s:s+1,q:0} : 'END';
}
function go(){
  const n = nextPos();
  st.hist.push(st.pos);
  if(n==='END'){ st.pos=null; save(); submit(); return; }
  st.pos=n; save(); show();
}
function back(){ if(!st.hist.length){ st.pos=null; save(); intro(); return; } st.pos = st.hist.pop(); save(); show(); }

// ---------- question screen ----------
function show(){
  progress();
  const sec = S[st.pos.s], q = sec.questions[st.pos.q];
  const firstOfSection = st.pos.q===0;
  const wrap = el('section',{class:'fade'});
  wrap.append(el('div',{class:'eyebrow'}, sectionName(sec)));
  if(firstOfSection && sec.help) wrap.append(el('p',{class:'help',style:'margin-bottom:14px;color:#3B3330'}, sec.help));
  wrap.append(el('h2',{class:'q',id:'qlabel'}, clean(q.label)));
  const helpTxt = q.type==='multi' ? ((q.help||'').replace(/^Select/,'Choose') || 'Choose all that apply.') : (q.help || (q.required ? '' : 'Optional.'));
  if(helpTxt) wrap.append(el('p',{class:'help'}, helpTxt));
  const cur = st.answers[q.id];
  let nextBtn;

  if(q.type==='single' || q.type==='multi'){
    const multi = q.type==='multi';
    const sel = new Set(multi ? (cur||[]) : (cur!=null?[cur]:[]));
    let otherTxt = st.answers[q.id+'__other'] || '';
    const list = el('div',{class:'opts',role:multi?'group':'radiogroup','aria-labelledby':'qlabel'});
    const opts = q.options.concat(q.other ? ['Other'] : []);
    const otherInput = el('input',{class:'txt other',type:'text',placeholder:'Please specify',value:otherTxt,'aria-label':'Other, please specify',id:'other-'+q.id});
    otherInput.hidden = !sel.has('Other');
    otherInput.addEventListener('input',()=>{ st.answers[q.id+'__other']=otherInput.value; save(); });
    const buttons = opts.map(o=>{
      const b = el('button',{class:'opt'+(multi?' multi':''),type:'button','aria-pressed':String(sel.has(o))}, el('span',{class:'k','aria-hidden':'true'}), el('span',{},o));
      b.addEventListener('click',()=>{
        if(multi){
          if(sel.has(o)) sel.delete(o); else { if(q.max && sel.size>=q.max) return; sel.add(o); }
          st.answers[q.id]=[...sel]; refresh();
        } else {
          sel.clear(); sel.add(o); st.answers[q.id]=o; refresh();
          if(o!=='Other') setTimeout(go, 220); else otherInput.focus();
        }
        otherInput.hidden = !sel.has('Other'); save();
      });
      return b;
    });
    function refresh(){
      buttons.forEach((b,i)=>{ const on=sel.has(opts[i]); b.setAttribute('aria-pressed',String(on)); b.disabled = multi && q.max && !on && sel.size>=q.max; });
      if(nextBtn) nextBtn.disabled = q.required && sel.size===0;
      if(cnt) cnt.textContent = multi ? (sel.size ? sel.size+' selected'+(q.max?' of '+q.max:'') : '') : '';
    }
    buttons.forEach(b=>list.append(b));
    wrap.append(list, otherInput);
    var cnt = multi ? el('div',{class:'count'}) : null;
    if(cnt) wrap.append(cnt);
    nextBtn = el('button',{class:'btn',type:'button',onclick:go}, 'Continue');
    wrap.append(el('div',{class:'actions'+(multi?' sticky':'')}, el('button',{class:'link',type:'button',onclick:back},'← Back'), (multi || sel.size || sel.has('Other')) ? nextBtn : el('span')));
    refresh();
  } else {
    const isLong = q.type==='long';
    const input = isLong ? el('textarea',{class:'txt',id:'f-'+q.id,'aria-labelledby':'qlabel'}) :
      el('input',{class:'txt',id:'f-'+q.id,type: q.id==='C_email'?'email':(q.id==='C_whatsapp'?'tel':'text'),autocomplete: q.id==='C_name'?'name':(q.id==='C_email'?'email':(q.id==='C_whatsapp'?'tel':'off')),'aria-labelledby':'qlabel'});
    input.value = cur || '';
    input.addEventListener('input',()=>{ st.answers[q.id]=input.value; save(); });
    if(!isLong) input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } });
    wrap.append(input);
    const last = nextPos()==='END';
    wrap.append(el('div',{class:'actions'}, el('button',{class:'link',type:'button',onclick:back},'← Back'),
      el('button',{class:'btn',type:'button',onclick:go}, last ? 'Send my answers' : (input.value ? 'Continue' : 'Skip'))));
    input.addEventListener('input',()=>{ const b=wrap.querySelector('.btn'); if(!last) b.textContent = input.value ? 'Continue' : 'Skip'; });
  }
  app.replaceChildren(wrap);
  window.scrollTo({top:0});
}

// ---------- submit ----------
function payload(){
  const out = {};
  S.forEach(s=>s.questions.forEach(q=>{
    let v = st.answers[q.id]; if(v==null || v==='' || (Array.isArray(v)&&!v.length)) return;
    const oth = (st.answers[q.id+'__other']||'').trim();
    if(Array.isArray(v)) v = v.map(x=> x==='Other' && oth ? 'Other: '+oth : x).join('; ');
    else if(v==='Other' && oth) v = 'Other: '+oth;
    out[q.id] = v;
  }));
  return { id: st.id, started: new Date(st.started).toISOString(), submitted: new Date().toISOString(),
           minutes: Math.round((Date.now()-st.started)/6000)/10, answers: out, hp: '' };
}
async function submit(){
  bar.style.width='100%';
  app.replaceChildren(el('section',{class:'done fade'}, el('h2',{class:'q'},'Sending your answers…')));
  const body = JSON.stringify(payload());
  try {
    await fetch(ENDPOINT, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body });
    try { localStorage.removeItem(KEY); } catch(e){}
    thanks();
  } catch(e){
    app.replaceChildren(el('section',{class:'done fade'},
      el('h2',{class:'q'},'We couldn’t send your answers'),
      el('p',{class:'help'},'Please check your internet connection and try again. Your answers are kept on this device.'),
      el('div',{class:'actions',style:'justify-content:center'}, el('button',{class:'btn',onclick:submit},'Try again'))));
  }
}
function thanks(){
  app.replaceChildren(el('section',{class:'done fade'},
    el('div',{class:'mark','aria-hidden':'true'}, el('img',{src:'icon.png',alt:'',style:'width:34px;height:34px'})),
    el('div',{class:'eyebrow'},'Thank you'),
    el('h1',{},'Your answers have been sent'),
    el('p',{class:'lead'},'Thank you for contributing to this research. Your feedback will help us develop an equestrian centre that responds to the needs of Lebanon’s riding and show-jumping community.'),
    el('p',{class:'note'},'You can now close this page.')));
}

st.pos ? intro() : intro();
</script>
